<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D7 League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #111111;
    --bg2: #1a1a1a;
    --bg3: #222222;
    --border: #2a2a2a;
    --green: #00E5A0;
    --green-dim: rgba(0,229,160,0.12);
    --green-glow: 0 0 18px rgba(0,229,160,0.35);
    --text: #f0f0f0;
    --text-muted: #888;
    --radius: 10px;
    --transition: 0.2s ease;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    min-height: 100vh;
    padding-bottom: 72px;
  }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg2); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* TOP NAV DESKTOP */
  #top-nav {
    display: none;
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(17,17,17,0.95);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    align-items: center;
    gap: 8px;
    height: 60px;
  }

  #top-nav .logo-area {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-right: 24px;
    text-decoration: none;
  }

  #top-nav .logo-area span {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    color: var(--green);
    letter-spacing: 2px;
  }

  #top-nav a.nav-link {
    padding: 8px 14px;
    border-radius: 6px;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    transition: all var(--transition);
    letter-spacing: 0.5px;
  }

  #top-nav a.nav-link:hover { color: var(--text); background: var(--bg3); }
  #top-nav a.nav-link.active { color: var(--green); background: var(--green-dim); }

  #top-nav .spacer { flex: 1; }

  /* BOTTOM NAV MOBILE */
  #bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 100;
    background: rgba(17,17,17,0.97);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    display: flex;
    height: 64px;
  }

  #bottom-nav a.bnav-link {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 10px;
    font-weight: 500;
    transition: color var(--transition);
    letter-spacing: 0.3px;
  }

  #bottom-nav a.bnav-link svg { width: 20px; height: 20px; }
  #bottom-nav a.bnav-link.active { color: var(--green); }
  #bottom-nav a.bnav-link.active svg path, #bottom-nav a.bnav-link.active svg rect,
  #bottom-nav a.bnav-link.active svg circle, #bottom-nav a.bnav-link.active svg polygon {
    stroke: var(--green);
  }

  /* MAIN CONTAINER */
  #app {
    max-width: 900px;
    margin: 0 auto;
    padding: 16px;
  }

  /* PAGE HEADER */
  .page-hero {
    text-align: center;
    padding: 32px 0 24px;
  }

  .page-hero h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(36px, 8vw, 64px);
    letter-spacing: 4px;
    color: var(--text);
    line-height: 1;
  }

  .page-hero .subtitle {
    margin-top: 8px;
    color: var(--text-muted);
    font-size: 13px;
    font-style: italic;
  }

  .green-text { color: var(--green); }

  /* CARDS */
  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .card-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-header h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 2px;
    color: var(--green);
  }

  /* STANDINGS TABLE */
  .standings-table {
    width: 100%;
    border-collapse: collapse;
  }

  .standings-table th {
    padding: 10px 8px;
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    background: var(--bg3);
    border-bottom: 1px solid var(--border);
  }

  .standings-table th.left { text-align: left; }

  .standings-table td {
    padding: 11px 8px;
    text-align: center;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
    transition: background var(--transition);
  }

  .standings-table td.left { text-align: left; }

  .standings-table tr:last-child td { border-bottom: none; }

  .standings-table tbody tr:nth-child(even) td { background: rgba(255,255,255,0.015); }

  .standings-table tbody tr.leader td {
    background: var(--green-dim);
    color: var(--green);
    font-weight: 600;
  }

  .standings-table tbody tr:hover td { background: rgba(255,255,255,0.04); }
  .standings-table tbody tr.leader:hover td { background: rgba(0,229,160,0.18); }

  .pos-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    font-size: 12px;
    font-weight: 700;
  }

  .pos-1 { background: var(--green); color: #000; box-shadow: var(--green-glow); }
  .pos-2 { background: #888; color: #000; }
  .pos-3 { background: #664; color: #fff; }

  .team-name-cell {
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }

  .pts-cell {
    font-weight: 700;
    font-size: 15px;
  }

  .leader .pts-cell { color: var(--green); text-shadow: 0 0 12px rgba(0,229,160,0.5); }

  /* MINI SHIELD */
  .mini-shield {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
  }

  /* ACCORDION - CALENDAR */
  .jornada-block {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 10px;
    overflow: hidden;
  }

  .jornada-header {
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
    transition: background var(--transition);
  }

  .jornada-header:hover { background: var(--bg3); }

  .jornada-header .j-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 2px;
    color: var(--green);
  }

  .jornada-header .j-status {
    font-size: 11px;
    color: var(--text-muted);
    background: var(--bg3);
    padding: 3px 8px;
    border-radius: 20px;
    border: 1px solid var(--border);
  }

  .jornada-header .j-chevron {
    color: var(--text-muted);
    transition: transform var(--transition);
    font-size: 16px;
  }

  .jornada-body {
    display: none;
    border-top: 1px solid var(--border);
  }

  .jornada-body.open { display: block; }

  .match-row {
    padding: 14px 18px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    transition: background var(--transition);
  }

  .match-row:last-child { border-bottom: none; }
  .match-row:hover { background: rgba(255,255,255,0.02); }

  .match-team { font-weight: 500; font-size: 13px; }
  .match-team.home { text-align: right; }
  .match-team.away { text-align: left; }

  .match-score {
    text-align: center;
    min-width: 80px;
  }

  .score-display {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    letter-spacing: 3px;
    color: var(--green);
    text-shadow: var(--green-glow);
  }

  .score-pending {
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.4;
  }

  .match-date { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  /* STATS */
  .stats-section { margin-bottom: 20px; }

  .stats-table {
    width: 100%;
    border-collapse: collapse;
  }

  .stats-table th {
    padding: 10px 14px;
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    background: var(--bg3);
    border-bottom: 1px solid var(--border);
  }

  .stats-table th.right { text-align: right; }

  .stats-table td {
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }

  .stats-table td.right { text-align: right; }
  .stats-table tr:last-child td { border-bottom: none; }
  .stats-table tbody tr:hover td { background: rgba(255,255,255,0.03); }

  .rank-num {
    font-weight: 700;
    color: var(--text-muted);
    font-size: 12px;
    width: 24px;
    display: inline-block;
  }

  .rank-1 .rank-num { color: var(--green); }

  .stat-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    color: var(--green);
  }

  .team-badge-small {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 1px;
  }

  /* AWARDS */
  .awards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px;
    margin-bottom: 20px;
  }

  .award-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .award-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--green);
  }

  .award-icon { font-size: 32px; margin-bottom: 8px; }

  .award-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    letter-spacing: 2px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .award-winner {
    font-weight: 700;
    font-size: 15px;
    color: var(--green);
  }

  .award-sub { font-size: 11px; color: var(--text-muted); margin-top: 3px; }

  .motm-list { display: flex; flex-direction: column; gap: 8px; }

  .motm-item {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .motm-jornada {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px;
    letter-spacing: 1px;
    color: var(--text-muted);
  }

  .motm-player { font-weight: 600; color: var(--green); }
  .motm-team { font-size: 11px; color: var(--text-muted); }

  /* TEAMS */
  .teams-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
  }

  .team-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: all var(--transition);
  }

  .team-card:hover {
    border-color: var(--green);
    transform: translateY(-2px);
    box-shadow: var(--green-glow);
  }

  .team-card-header {
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .team-card-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    letter-spacing: 1.5px;
    text-align: center;
    line-height: 1.1;
  }

  .team-card-body {
    padding: 0 0 12px;
    border-top: 1px solid var(--border);
  }

  .player-list { list-style: none; }

  .player-list li {
    padding: 7px 16px;
    font-size: 12px;
    color: var(--text-muted);
    border-bottom: 1px solid rgba(255,255,255,0.04);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .player-list li:last-child { border-bottom: none; }
  .player-num { color: var(--green); font-weight: 600; font-size: 11px; width: 16px; }

  /* ADMIN */
  .admin-login {
    max-width: 380px;
    margin: 60px auto;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
    text-align: center;
  }

  .admin-login h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 3px;
    color: var(--green);
    margin-bottom: 24px;
  }

  .admin-login .lock-icon { font-size: 40px; margin-bottom: 16px; }

  .form-group { margin-bottom: 16px; text-align: left; }

  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .form-group input, .form-group select {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    transition: border-color var(--transition);
    outline: none;
  }

  .form-group input:focus, .form-group select:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(0,229,160,0.1);
  }

  .form-group select option { background: var(--bg3); }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 20px;
    border-radius: 6px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition);
    border: none;
    outline: none;
    letter-spacing: 0.5px;
  }

  .btn-primary {
    background: var(--green);
    color: #000;
  }

  .btn-primary:hover {
    background: #00ffb0;
    box-shadow: var(--green-glow);
  }

  .btn-secondary {
    background: var(--bg3);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover { background: var(--border); }

  .btn-danger {
    background: #ff4444;
    color: #fff;
  }

  .btn-danger:hover { background: #ff6666; }

  .btn-sm { padding: 6px 12px; font-size: 12px; }

  .btn-icon {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 6px 8px;
    border-radius: 6px;
    cursor: pointer;
    transition: all var(--transition);
    font-size: 13px;
  }

  .btn-icon:hover { border-color: var(--green); color: var(--green); }

  .error-msg {
    color: #ff4444;
    font-size: 12px;
    margin-top: 8px;
  }

  /* ADMIN MATCHES LIST */
  .admin-match-item {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all var(--transition);
  }

  .admin-match-item:hover {
    border-color: var(--green);
    background: var(--green-dim);
  }

  .admin-match-teams { font-weight: 500; font-size: 13px; }
  .admin-match-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .admin-match-score { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--green); }
  .admin-match-pending { font-size: 11px; color: var(--text-muted); }

  /* MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 200;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 20px;
    overflow-y: auto;
    backdrop-filter: blur(4px);
  }

  .modal {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 100%;
    max-width: 620px;
    margin: auto;
  }

  .modal-header {
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .modal-header h3 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 2px;
    color: var(--green);
  }

  .modal-close {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 20px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
    transition: color var(--transition);
  }

  .modal-close:hover { color: var(--text); }

  .modal-body { padding: 20px; }
  .modal-footer {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }

  .score-inputs {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 12px;
    align-items: center;
    margin-bottom: 20px;
    background: var(--bg3);
    padding: 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
  }

  .score-inputs input[type=number] {
    text-align: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    padding: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--green);
    outline: none;
    width: 100%;
  }

  .score-inputs input[type=number]:focus { border-color: var(--green); }
  .score-sep { font-family: 'Bebas Neue', sans-serif; font-size: 24px; text-align: center; color: var(--text-muted); }

  .section-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 15px;
    letter-spacing: 2px;
    color: var(--text-muted);
    margin-bottom: 10px;
    margin-top: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .dynamic-row {
    display: grid;
    gap: 6px;
    align-items: center;
    margin-bottom: 6px;
    background: var(--bg3);
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
  }

  .dynamic-row.goal-row { grid-template-columns: 1fr 1fr 60px auto; }
  .dynamic-row.assist-row { grid-template-columns: 1fr 1fr auto; }
  .dynamic-row.card-row { grid-template-columns: 1fr 1fr 90px auto; }

  .dynamic-row select, .dynamic-row input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 8px;
    color: var(--text);
    font-size: 12px;
    outline: none;
  }

  .dynamic-row select:focus, .dynamic-row input:focus { border-color: var(--green); }

  .remove-btn {
    background: none;
    border: 1px solid #ff444466;
    color: #ff4444;
    border-radius: 4px;
    padding: 4px 8px;
    cursor: pointer;
    font-size: 14px;
    transition: all var(--transition);
  }

  .remove-btn:hover { background: #ff444422; }

  /* SECTION TABS */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px;
  }

  .tab-btn {
    flex: 1;
    padding: 8px 12px;
    border-radius: 5px;
    background: none;
    border: none;
    color: var(--text-muted);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all var(--transition);
    text-transform: uppercase;
  }

  .tab-btn.active { background: var(--green); color: #000; }
  .tab-btn:hover:not(.active) { color: var(--text); background: var(--bg3); }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* MISC */
  .section-gap { margin-bottom: 20px; }
  .flex-between { display: flex; align-items: center; justify-content: space-between; }
  .flex-gap { display: flex; align-items: center; gap: 8px; }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
  }

  .badge-green { background: var(--green-dim); color: var(--green); border: 1px solid rgba(0,229,160,0.3); }
  .badge-yellow { background: rgba(255,215,0,0.15); color: #FFD700; border: 1px solid rgba(255,215,0,0.3); }
  .badge-red { background: rgba(255,68,68,0.15); color: #ff4444; border: 1px solid rgba(255,68,68,0.3); }
  .badge-muted { background: var(--bg3); color: var(--text-muted); border: 1px solid var(--border); }

  .glow-line {
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--green), transparent);
    margin: 24px 0;

let teams, matches, adminLoggedIn = false, currentPage = 'clasificacion';
let activeStatsTab = 'goleadores';

function loadData() {
  const savedTeams = localStorage.getItem('d7_teams');
  const savedMatches = localStorage.getItem('d7_matches');
  teams = savedTeams ? JSON.parse(savedTeams) : JSON.parse(JSON.stringify(DEFAULT_TEAMS));
  matches = savedMatches ? JSON.parse(savedMatches) : JSON.parse(JSON.stringify(DEFAULT_MATCHES));
}

function saveData() {
  localStorage.setItem('d7_teams', JSON.stringify(teams));
  localStorage.setItem('d7_matches', JSON.stringify(matches));
}

// =====================================================
// HELPERS
// =====================================================

function getTeam(id) { return teams.find(t => t.id === id); }

function getPlayer(playerId) {
  for (const t of teams) {
    const p = t.players.find(p => p.id === playerId);
    if (p) return { ...p, teamId: t.id, teamName: t.name };
  }
  return null;
}

function getPlayerName(playerId) {
  const p = getPlayer(playerId);
  return p ? p.name : 'Desconocido';
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T12:00:00');
  return d.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' });
}

function shieldSVG(teamId, size = 36) {
  const c = TEAM_COLORS[teamId] || { bg: '#1a1a2e', accent: '#888' };

// =====================================================
// STANDINGS COMPUTATION
// =====================================================

function computeStandings() {
  const table = {};
  teams.forEach(t => {
    table[t.id] = { id: t.id, name: t.name, pj:0, g:0, e:0, p:0, gf:0, gc:0, pts:0 };
  });

  matches.filter(m => m.played).forEach(m => {
    const h = table[m.homeTeam];
    const a = table[m.awayTeam];
    if (!h || !a) return;
    h.pj++; a.pj++;
    h.gf += m.homeScore; h.gc += m.awayScore;
    a.gf += m.awayScore; a.gc += m.homeScore;
    if (m.homeScore > m.awayScore) { h.g++; h.pts+=3; a.p++; }
    else if (m.homeScore < m.awayScore) { a.g++; a.pts+=3; h.p++; }
    else { h.e++; h.pts++; a.e++; a.pts++; }
  });

  return Object.values(table).sort((a,b) => {
    if (b.pts !== a.pts) return b.pts - a.pts;
    const dgA = a.gf - a.gc, dgB = b.gf - b.gc;
    if (dgB !== dgA) return dgB - dgA;
    return b.gf - a.gf;
  });
}

// =====================================================
// STATS COMPUTATION
// =====================================================

function computeGoalScorers() {
  const map = {};
  matches.filter(m => m.played).forEach(m => {
    (m.goals || []).forEach(g => {
      if (!map[g.player]) map[g.player] = { player: g.player, team: g.team, goals: 0 };
      map[g.player].goals++;
    });
  });
  return Object.values(map).sort((a,b) => b.goals - a.goals);
}

function computeAssists() {
  const map = {};
  matches.filter(m => m.played).forEach(m => {
    (m.assists || []).forEach(a => {
      if (!map[a.player]) map[a.player] = { player: a.player, team: a.team, assists: 0 };
      map[a.player].assists++;
    });
  });
  return Object.values(map).sort((a,b) => b.assists - a.assists);
}

function computeCards() {
  const map = {};
  matches.filter(m => m.played).forEach(m => {
    (m.cards || []).forEach(c => {
      if (!map[c.player]) map[c.player] = { player: c.player, team: c.team, yellow: 0, red: 0 };
      if (c.type === 'yellow') map[c.player].yellow++;
      else map[c.player].red++;
    });
  });
  return Object.values(map).sort((a,b) => (b.red*3+b.yellow) - (a.red*3+a.yellow));
}

function computeFairPlay() {
  const map = {};
  teams.forEach(t => { map[t.id] = { id: t.id, name: t.name, yellow: 0, red: 0, total: 0 }; });
  matches.filter(m => m.played).forEach(m => {
    (m.cards || []).forEach(c => {
      if (!map[c.team]) return;
      if (c.type === 'yellow') { map[c.team].yellow++; map[c.team].total++; }
      else { map[c.team].red++; map[c.team].total += 3; }
    });
  });
  return Object.values(map).sort((a,b) => a.total - b.total);
}

function computeMOTM() {
  const results = [];
  matches.filter(m => m.played && m.motm && m.motm.player).forEach(m => {
    results.push({ jornada: m.jornada, matchId: m.id, player: m.motm.player, team: m.motm.team });
  });
  return results;
}

function computeSeasonMVP() {
  const map = {};
  computeMOTM().forEach(m => {
    if (!map[m.player]) map[m.player] = { player: m.player, team: m.team, count: 0 };
    map[m.player].count++;
  });
  const sorted = Object.values(map).sort((a,b) => b.count - a.count);
  return sorted[0] || null;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;

}

function updateNavActive() {
  document.querySelectorAll('[data-page]').forEach(el => {
    el.classList.toggle('active', el.dataset.page === currentPage);
  });
}

function showPage(page) {
  currentPage = page;
  updateNavActive();
  const app = document.getElementById('app');
  let html = '';
  switch (page) {
    case 'clasificacion': html = renderClasificacion(); break;
    case 'calendario': html = renderCalendario(); break;
    case 'estadisticas': html = renderEstadisticas(); break;
    case 'premios': html = renderPremios(); break;
    case 'equipos': html = renderEquipos(); break;
    case 'admin': html = renderAdmin(); break;
    default: html = renderClasificacion();
  }
  app.innerHTML = `<div class="page">${html}</div>`;
  bindEvents(page);
}

  const m = matches.find(x => x.id === matchId);
  if (!m) return;

  const at = getTeam(m.awayTeam);

  const allPlayers = teams.flatMap(t => t.players.map(p => ({ ...p, teamId: t.id, teamName: t.name })));

  function playerOptions(selectedId = null) {
    return allPlayers.map(p =>
      `<option value="${p.id}" data-team="${p.teamId}" ${p.id === selectedId ? 'selected' : ''}>${p.name} (${getTeam(p.teamId)?.name})</option>`
    ).join('');
  }

  function teamOptions(selectedId = null) {
    return teams.map(t =>
      `<option value="${t.id}" ${t.id === selectedId ? 'selected' : ''}>${t.name}</option>`
    ).join('');
  }

  function goalRow(g = null, idx = '') {
    return `<div class="dynamic-row goal-row" data-type="goal">
      <select class="goal-player">${playerOptions(g?.player)}</select>
      <select class="goal-team">${teamOptions(g?.team)}</select>

      <button class="remove-btn" onclick="this.closest('.dynamic-row').remove()">✕</button>
    </div>`;
  }

  function assistRow(a = null) {
    return `<div class="dynamic-row assist-row" data-type="assist">
      <select class="assist-player">${playerOptions(a?.player)}</select>
      <select class="assist-team">${teamOptions(a?.team)}</select>
      <button class="remove-btn" onclick="this.closest('.dynamic-row').remove()">✕</button>
    </div>`;
  }

  function cardRow(c = null) {
    return `<div class="dynamic-row card-row" data-type="card">
      <select class="card-player">${playerOptions(c?.player)}</select>
      <select class="card-team">${teamOptions(c?.team)}</select>
      <select class="card-type">
        <option value="yellow" ${(!c||c.type==='yellow')?'selected':''}>🟨 Amarilla</option>
        <option value="red" ${c?.type==='red'?'selected':''}>🟥 Roja</option>
      </select>
      <button class="remove-btn" onclick="this.closest('.dynamic-row').remove()">✕</button>
    </div>`;
  }

  const goalsHTML = (m.goals || []).map(g => goalRow(g)).join('');
  const assistsHTML = (m.assists || []).map(a => assistRow(a)).join('');
  const cardsHTML = (m.cards || []).map(c => cardRow(c)).join('');

  const modal = `<div class="modal-overlay" id="match-modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3>${ht?.name} vs ${at?.name}</h3>
        <button class="modal-close" id="modal-close-btn">✕</button>
      </div>
      <div class="modal-body">
        <div class="score-inputs">
          <div>
            <div style="font-size:11px;color:var(--text-muted);text-align:center;margin-bottom:6px">${ht?.name}</div>
            <input type="number" id="home-score" min="0" max="99" value="${m.played ? m.homeScore : 0}">
          </div>
          <div class="score-sep">VS</div>
          <div>
            <div style="font-size:11px;color:var(--text-muted);text-align:center;margin-bottom:6px">${at?.name}</div>
            <input type="number" id="away-score" min="0" max="99" value="${m.played ? m.awayScore : 0}">
          </div>
        </div>

        <div class="section-label">
          GOLES
          <button class="btn btn-secondary btn-sm" id="add-goal-btn">+ Añadir</button>
        </div>
        <div id="goals-container">${goalsHTML}</div>

        <div class="section-label">
          ASISTENCIAS
          <button class="btn btn-secondary btn-sm" id="add-assist-btn">+ Añadir</button>
        </div>
        <div id="assists-container">${assistsHTML}</div>

        <div class="section-label">
          TARJETAS
          <button class="btn btn-secondary btn-sm" id="add-card-btn">+ Añadir</button>
        </div>
        <div id="cards-container">${cardsHTML}</div>

        <div class="section-label">JUGADOR DEL PARTIDO</div>
        <div class="dynamic-row" style="grid-template-columns:1fr 1fr">
          <select id="motm-player">${playerOptions(m.motm?.player)}</select>
          <select id="motm-team">${teamOptions(m.motm?.team)}</select>
        </div>

        <div style="margin-top:16px">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
            <input type="checkbox" id="mark-played" ${m.played ? 'checked' : ''} style="accent-color:var(--green);width:16px;height:16px">
            <span style="font-size:13px;font-weight:500">Marcar como jugado</span>
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="modal-cancel-btn">Cancelar</button>
        <button class="btn btn-primary" id="modal-save-btn" data-matchid="${matchId}">Guardar Cambios</button>
      </div>
    </div>
  </div>`;

  document.getElementById('modal-container').innerHTML = modal;

  document.getElementById('modal-close-btn').onclick = closeModal;
  document.getElementById('modal-cancel-btn').onclick = closeModal;
  document.getElementById('match-modal-overlay').onclick = (e) => { if (e.target.id === 'match-modal-overlay') closeModal(); };

  document.getElementById('add-goal-btn').onclick = () => {
    document.getElementById('goals-container').insertAdjacentHTML('beforeend', goalRow());
  };
  document.getElementById('add-assist-btn').onclick = () => {
    document.getElementById('assists-container').insertAdjacentHTML('beforeend', assistRow());
  };
  document.getElementById('add-card-btn').onclick = () => {
    document.getElementById('cards-container').insertAdjacentHTML('beforeend', cardRow());
  };

  document.getElementById('modal-save-btn').onclick = () => saveMatch(matchId);
}

function closeModal() {
  document.getElementById('modal-container').innerHTML = '';
}

function saveMatch(matchId) {
  const m = matches.find(x => x.id === matchId);
  if (!m) return;

  m.homeScore = parseInt(document.getElementById('home-score').value) || 0;
  m.awayScore = parseInt(document.getElementById('away-score').value) || 0;
  m.played = document.getElementById('mark-played').checked;

  // Goals
  m.goals = [];
  document.querySelectorAll('#goals-container .dynamic-row').forEach(row => {
    const player = parseInt(row.querySelector('.goal-player').value);
    const team = parseInt(row.querySelector('.goal-team').value);
    const minute = parseInt(row.querySelector('.goal-minute').value) || 0;
    if (player) m.goals.push({ player, team, minute });
  });

  // Assists
  m.assists = [];
  document.querySelectorAll('#assists-container .dynamic-row').forEach(row => {
    const player = parseInt(row.querySelector('.assist-player').value);
    const team = parseInt(row.querySelector('.assist-team').value);
    if (player) m.assists.push({ player, team });
  });

  // Cards
  m.cards = [];
  document.querySelectorAll('#cards-container .dynamic-row').forEach(row => {
    const player = parseInt(row.querySelector('.card-player').value);
    const team = parseInt(row.querySelector('.card-team').value);
    const type = row.querySelector('.card-type').value;
    if (player) m.cards.push({ player, team, type });
  });

  // MOTM
  const motmPlayer = parseInt(document.getElementById('motm-player').value);
  const motmTeam = parseInt(document.getElementById('motm-team').value);
  m.motm = motmPlayer ? { player: motmPlayer, team: motmTeam } : null;

  saveData();
  closeModal();
  showToast('Partido guardado correctamente');
  showPage('admin');
}

// =====================================================
// EVENT BINDING
// =====================================================

function bindEvents(page) {
  if (page === 'clasificacion') {
    // no special bindings
  }

  if (page === 'calendario') {
    document.querySelectorAll('.jornada-header').forEach(header => {
      header.addEventListener('click', () => {
        const j = header.dataset.jornada;
        const body = document.getElementById(`jbody-${j}`);
        const chev = document.getElementById(`chev-${j}`);
        body.classList.toggle('open');
        chev.textContent = body.classList.contains('open') ? '▲' : '▼';
      });
    });
  }

  if (page === 'estadisticas') {
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        activeStatsTab = btn.dataset.tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
        const app = document.getElementById('app');
        const tabArea = app.querySelector('#stats-tab-content');
        if (tabArea) {
          tabArea.innerHTML = renderStatsContent(activeStatsTab);
        } else {
          // re-render the content below tabs
          const tabsEl = app.querySelector('.tabs');
          if (tabsEl) {
            let next = tabsEl.nextElementSibling;
            while (next) {
              const toRemove = next;
              next = next.nextElementSibling;
              toRemove.remove();
            }
            tabsEl.insertAdjacentHTML('afterend', `<div id="stats-tab-content">${renderStatsContent(activeStatsTab)}</div>`);
          }
        }
      });
    });
  }

  if (page === 'admin') {
    const loginBtn = document.getElementById('admin-login-btn');
    if (loginBtn) {
      loginBtn.onclick = () => {
        const pw = document.getElementById('admin-pw').value;
        if (pw === 'admin123') {
          adminLoggedIn = true;
          showPage('admin');
        } else {
          document.getElementById('admin-err').classList.remove('hidden');
        }
      };
      document.getElementById('admin-pw').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') loginBtn.click();
      });
    }

    const logoutBtn = document.getElementById('admin-logout-btn');
    if (logoutBtn) {
      logoutBtn.onclick = () => { adminLoggedIn = false; showPage('admin'); };
    }

    document.querySelectorAll('.admin-match-item').forEach(item => {
      item.addEventListener('click', () => {
        const id = parseInt(item.dataset.matchid);
        openMatchModal(id);
      });
    });
  }
}

// =====================================================
// ROUTING
// =====================================================

function getPageFromHash() {
  const hash = window.location.hash.replace('#', '');
  const valid = ['clasificacion', 'calendario', 'estadisticas', 'premios', 'equipos', 'admin'];
  return valid.includes(hash) ? hash : 'clasificacion';
}

window.addEventListener('hashchange', () => {
  showPage(getPageFromHash());
});

window.addEventListener('popstate', () => {
  showPage(getPageFromHash());
});

// =====================================================
// INIT
// =====================================================

loadData();
showPage(getPageFromHash());
</script>
</body>
</html>
